<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PULSE</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Enlace al CSS estático -->
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

    <!-- HEADER / NAVEGACIÓN -->
    <header class="header">
       <div class="logo-container">
            <a href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='IMAGENES/logo.png') }}" alt="Logo Pulse" class="nav-logo">
            </a>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('quienes_somos') }}">QUIÉNES SOMOS</a>
<a href="{{ url_for('mision') }}">MISIÓN</a>
        </nav>
        
        <div class="header-actions">
            {% if usuario_activo %}
                <a href="#" style="display: flex; align-items: center; gap: 10px; background: rgba(168, 85, 247, 0.15); padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(168, 85, 247, 0.3); text-decoration: none;">
                    <i class="fa-solid fa-user-circle" style="font-size: 1.4rem; color: #a855f7;"></i>
                    <span style="color: #fff; font-weight: 500; font-size: 0.95rem;">{{ usuario_activo }}</span>
                </a>
            {% else %}
                <a href="{{ url_for('registro') }}" class="btn-primary">REGISTRATE</a>
<a href="{{ url_for('login') }}" class="btn-profile">INICIAR SESIÓN</a>            {% endif %}
        </div>
    </header>

    <!-- CONTENIDO: INICIO DE SESIÓN -->
    <main class="hero-section" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="hero-content" style="max-width: 450px; width: 100%; text-align: center; margin: 0 auto; background: rgba(18, 18, 18, 0.85); padding: 40px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
            <span class="hero-subtitle">BIENVENIDO DE NUEVO</span>
            <h1 class="hero-title" style="font-size: 2.2rem; margin-bottom: 25px;">INICIAR SESIÓN</h1>
            
            {% if error %}
                <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem;">
                    {{ error }}
                </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" style="display: flex; flex-direction: column; gap: 20px; text-align: left;">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="usuario" style="color: #9ca3af; font-size: 0.9rem; font-weight: 500;">Usuario</label>
                    <!-- CORREGIDO: name="usuario" para que coincida con app.py -->
                    <input type="text" id="usuario" name="usuario" required placeholder="Tu nombre de usuario" style="padding: 12px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: 'Outfit', sans-serif; outline: none;">
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="password" style="color: #9ca3af; font-size: 0.9rem; font-weight: 500;">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" style="padding: 12px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: 'Outfit', sans-serif; outline: none;">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; border: none; font-weight: 600; text-align: center;">ENTRAR</button>
            </form>

            <p style="margin-top: 25px; color: #9ca3af; font-size: 0.9rem;">
                ¿No tienes una cuenta? <a href="{{ url_for('registro') }}" style="color: #fff; text-decoration: underline; font-weight: 600;">Regístrate aquí</a>
            </p>
        </div>
    </main>

</body>
</html>
