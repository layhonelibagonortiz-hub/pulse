<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - PULSE</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <!-- Enlace al CSS estático -->
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body style="background-color: #0b0614; background-image: radial-gradient(circle at 50% 20%, #2b1055 0%, #0b0614 70%); min-height: 100vh; margin: 0; font-family: 'Outfit', sans-serif; color: #fff;">

    <!-- BARRA SUPERIOR UNIFICADA -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: rgba(10, 6, 20, 0.7); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(168, 85, 247, 0.2);">
        <div style="display: flex; align-items: center;">
            <a href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='IMAGENES/logo.png') }}" alt="Logo Pulse" style="height: 60px; width: auto; object-fit: contain;">
            </a>
        </div>
        
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="{{ url_for('index') }}" style="color: #9ca3af; text-decoration: none; font-weight: 600; font-size: 0.85rem; padding: 10px 15px; border-radius: 20px; transition: color 0.3s ease;"><i class="fa-solid fa-house"></i> Panel</a>
            
            <!-- Carrito oculto para el rol administrador -->
            {% if session.get('rol') != 'admin' %}
                <a href="{{ url_for('ver_carrito') }}" style="color: #fff; text-decoration: none; font-weight: 600; font-size: 0.85rem; background: rgba(168, 85, 247, 0.2); padding: 10px 20px; border-radius: 25px; border: 1px solid rgba(168, 85, 247, 0.4); display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease;"><i class="fa-solid fa-cart-shopping"></i> Carrito</a>
            {% endif %}
            
            <a href="{{ url_for('logout') }}" style="background: linear-gradient(90deg, #dc2626, #ef4444); color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: 600; font-size: 0.85rem; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); transition: all 0.3s ease;">Cerrar Sesión</a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main style="max-width: 1100px; margin: 40px auto; padding: 0 20px;">
        
        <!-- TARJETA DE PANEL DE USUARIO -->
        <div style="background: rgba(15, 10, 25, 0.7); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 16px; padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);">
            <div style="display: flex; align-items: center; gap: 20px;">
                <div style="width: 70px; height: 70px; background: rgba(168, 85, 247, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(168, 85, 247, 0.4);">
                    <i class="fa-solid fa-user" style="font-size: 2rem; color: #a855f7;"></i>
                </div>
                <div>
                    <span style="color: #9ca3af; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;">PANEL DE USUARIO</span>
                    <h1 style="font-size: 2.2rem; margin: 5px 0 0 0; color: #fff; font-weight: 700;">¡Hola, {{ usuario_activo }}!</h1>
                </div>
            </div>
            
            <a href="{{ url_for('logout') }}" style="background: linear-gradient(90deg, #dc2626, #ef4444); color: white; padding: 12px 24px; border-radius: 20px; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);">
                <i class="fa-solid fa-right-from-bracket"></i> CERRAR SESIÓN
            </a>
        </div>

    </main>

</body>
</html>
